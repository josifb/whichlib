# whichlib hosted API: /api/* (JSON) and /mcp (remote MCP, stateless).
# Secrets (never in this file): GITHUB_TOKEN (fine-grained, no permissions;
# the owner runs `npx wrangler secret put GITHUB_TOKEN` in their own terminal),
# IP_SALT (random), and TYPESAFE_API_KEY (TypeSafe System One; optional:
# without it recommend uses the word-match ranking). Local dev reads them
# from api/.dev.vars (git-ignored).
name = "whichlib"
main = "src/worker.mjs"
compatibility_date = "2026-09-01"

# Registered at Cloudflare 2026-10-02 (same account). No www yet: see the phase 5 plan.
routes = [{ pattern = "whichlib.com", custom_domain = true }]
# the workers.dev address is off since whichlib.com went live; it was never listed
workers_dev = false
preview_urls = false

# Runs before every `wrangler dev` / `wrangler deploy`: copies score.js
# (api/scripts/build-site.mjs).
[build]
command = "node scripts/build-site.mjs"

# Pages: static assets from ../site (free: asset requests do not run the Worker).
# Only the API and MCP paths run the Worker code.
[assets]
directory = "../site"
run_worker_first = ["/api/*", "/mcp"]
not_found_handling = "404-page"

# Same database as the call counter (telemetry/); this Worker adds daily_usage (schema.sql).
[[d1_databases]]
binding = "DB"
database_name = "whichlib-events"
database_id = "df51224e-40e1-481b-88e2-ffcfab3db39c"

# Burst guard: 20 tool calls per 60 s per hashed user id.
[[ratelimits]]
name = "BURST"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>whichlib share card</title>
<!-- Source of /og.png (1200x630). Not served: site/.assetsignore lists og/.
     Re-render after a change: node api/scripts/og-image.mjs
     Colours are the light-theme tokens of site/style.css; the rows are the
     Home example (site/index.html) with their score parts as points
     (weight x part). System fonts only, no external requests. -->
<style>
  :root {
    --bg: #f7f9f8; --surface: #ffffff; --text: #16202a; --muted: #56636f;
    --border: #d8dfe3; --accent: #0b6e7a; --accent-soft: #d6eef0; --track: #e3e8ea;
    --tier-strong-bg: #dcefe1; --tier-strong-text: #1d5a30;
    --seg-momentum: #0b6e7a; --seg-maintenance: #4b6478; --seg-adoption: #5f8a6e; --seg-license: #c2a15a;
    --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); padding: 64px 72px; display: grid; grid-template-columns: 430px 1fr; gap: 56px; align-items: center; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 56px; font-weight: 700; letter-spacing: -1.5px; }
  .brand svg { width: 64px; height: 64px; }
  .line { margin: 26px 0 0; font-size: 40px; line-height: 1.15; font-weight: 600; letter-spacing: -0.5px; }
  .domain { margin-top: 30px; font-size: 26px; color: var(--accent); font-weight: 600; }
  .answer { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 26px 30px 12px; }
  .q { font-size: 28px; font-weight: 600; margin: 0 0 8px; }
  .row { padding: 18px 0 20px; border-top: 1px solid var(--border); }
  .head { display: flex; justify-content: space-between; align-items: baseline; font-size: 26px; font-weight: 600; }
  .pill { font-size: 21px; font-weight: 500; padding: 3px 14px; border-radius: 999px; background: var(--accent-soft); }
  .pill.strong { background: var(--tier-strong-bg); color: var(--tier-strong-text); }
  .bar { display: flex; height: 16px; margin-top: 14px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .bar span { display: block; height: 100%; }
  .bar span + span { box-shadow: inset 3px 0 0 var(--surface); }
  .m { background: var(--seg-momentum); } .t { background: var(--seg-maintenance); }
  .a { background: var(--seg-adoption); } .l { background: var(--seg-license); }
</style>
</head>
<body>
  <div>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0b6e7a"/><rect x="13" y="28" width="10" height="24" rx="3" fill="#fff" fill-opacity="0.5"/><rect x="27" y="12" width="10" height="40" rx="3" fill="#fff"/><rect x="41" y="22" width="10" height="30" rx="3" fill="#fff" fill-opacity="0.5"/></svg>
      whichlib
    </div>
    <p class="line">The dependency picker for coding agents</p>
    <div class="domain">whichlib.com</div>
  </div>
  <div class="answer">
    <p class="q">“Python http client”</p>
    <div class="row">
      <div class="head"><span>psf/requests</span><span class="pill strong">Strong 81</span></div>
      <div class="bar"><span class="m" style="width:22.7%"></span><span class="t" style="width:25%"></span><span class="a" style="width:23.7%"></span><span class="l" style="width:10%"></span></div>
    </div>
    <div class="row">
      <div class="head"><span>encode/httpx</span><span class="pill strong">Strong 79</span></div>
      <div class="bar"><span class="m" style="width:23%"></span><span class="t" style="width:25%"></span><span class="a" style="width:21%"></span><span class="l" style="width:10%"></span></div>
    </div>
    <div class="row">
      <div class="head"><span>urllib3/urllib3</span><span class="pill">Solid 62</span></div>
      <div class="bar"><span class="m" style="width:8.6%"></span><span class="t" style="width:25%"></span><span class="a" style="width:18.2%"></span><span class="l" style="width:10%"></span></div>
    </div>
  </div>
</body>
</html>

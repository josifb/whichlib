name: snapshot

# Runs the GitHub trending snapshot every morning and commits the result to
# the `data` branch, so history accumulates without bloating `main`.
# Pull it locally with `npm run pull-data` in whichlib/.

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily; off the hour to dodge the queue rush
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        working-directory: whichlib
        run: npm test

      - name: Run snapshot
        working-directory: whichlib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run snapshot

      - name: Enrich with npm / PyPI packages and weekly downloads
        working-directory: whichlib
        run: |
          set -euo pipefail
          # Reuse yesterday's repo -> package map so lookups are not repeated.
          if [ -f ../data-branch/registry-map.json ]; then
            cp ../data-branch/registry-map.json data/registry-map.json
          fi
          npm run enrich

      - name: Commit snapshot to data branch
        run: |
          set -euo pipefail
          mkdir -p data-branch/snapshots
          cp whichlib/data/snapshots/*.json data-branch/snapshots/
          cp whichlib/data/registry-map.json data-branch/registry-map.json
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots registry-map.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          FILES=$(git diff --cached --name-only -- snapshots | xargs -n1 basename | tr '\n' ' ')
          git commit -m "snapshot: ${FILES}"
          git push origin data

      - name: Score report
        working-directory: whichlib
        run: |
          rm -rf data/snapshots
          mkdir -p data
          cp -r ../data-branch/snapshots data/snapshots
          node snapshot/src/score-report.mjs 15
